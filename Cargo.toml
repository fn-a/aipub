[package]
name = "aipub"
version = "0.0.1"
edition = "2024"
authors = ["fn-a <mr.fna.co@gmail.com>"]
repository = "https://github.com/fn-a/aipub"
description = "AIP (Agent Interconnection Protocol) - A Rust Implementation Based on the ACPs Specification"
license = "MIT"
keywords = ["agent", "ai", "protocol", "acps", "aip"]

[dependencies]
protocols = { workspace = true }
discovery = { path = "crates/discovery", package = "aipub-discovery" }
registry = { path = "crates/registry", package = "aipub-registry" }
certifier = { path = "crates/certifier", package = "aipub-certifier" }
authorize = { path = "crates/authorize", package = "aipub-authorize" }

[dev-dependencies]
tokio = { version = "^1.52", features = ["full"] }
tokio-test = "^0.4"
serde_json = "^1.0"

[[example]]
name = "basic"
path = "examples/basic.rs"

[workspace]
resolver = "2"
members = [
    "crates/protocols",
    "crates/discovery",
    "crates/registry",
    "crates/certifier",
    "crates/authorize",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["fn-a <mr.fna.co@gmail.com>"]
license = "MIT"
repository = "https://github.com/fn-a/aipub"

[workspace.dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tokio = { version = "^1.52", features = ["full"] }
async-trait = "^0.1"
thiserror = "^2.0"
anyhow = "^1.0"
chrono = { version = "^0.4", features = ["serde"] }
uuid = { version = "^1.23", features = ["v4", "serde"] }
regex = "^1.12"
base64 = "^0.22"
hex = "^0.4"
sha2 = "^0.11"
rand = "^0.10"
tracing = "^0.1"
tracing-subscriber = "^0.3"
reqwest = { version = "^0.13", features = ["json"] }

protocols = { path = "crates/protocols", package = "aipub-protocols" }
